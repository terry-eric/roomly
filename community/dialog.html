<dialog id="create-dialog"><form id="create-space-form"><div class="dialog-heading"><h2>建立共用空間</h2><button id="close-create" class="icon-button" type="button" aria-label="關閉建立空間">×</button></div><label>空間名稱<input name="name" maxlength="80" required placeholder="例如：團隊會議室"></label><label>會議室地點<input name="location" maxlength="100" required placeholder="與 Google 日曆邀請中的地點一致"></label><label class="consent"><input name="shareConsent" type="checkbox" required>我同意與加入此空間的成員分享符合上述地點的會議與參與者名單。</label><p class="small muted">你是此空間的管理員。每個帳號最多建立 3 個空間，之後可移除成員或日曆授權。</p><p id="create-error" class="community-error" role="alert" hidden></p><div class="dialog-actions"><button class="primary" type="submit">同意並建立</button></div></form></dialog>
