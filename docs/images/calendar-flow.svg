<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="calendar-flow-title calendar-flow-desc">
  <title id="calendar-flow-title">Roomly 日曆授權與共用看板流程</title>
  <desc id="calendar-flow-desc">通過白名單的成員使用自己的 Google 日曆。本人同意日曆活動唯讀及日曆清單唯讀兩項權限後，Roomly 依設定的會議室地點彙整預約，讓平板與手機查看同一份看板。新增或修改預約仍在 Google 日曆完成。所有示意資料皆為虛構；看板顯示日曆預約，不代表感測器偵測的實際占用。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;fill:#253c3c}
      .heading{font-size:40px;font-weight:700}
      .step-title{font-size:34px;font-weight:700}
      .label{font-size:28px;fill:#526b59}
      .number{font-size:30px;font-weight:700;fill:#fffdf6}
      .note{font-size:26px;fill:#617459}
    </style>
    <marker id="flow-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L9 6L2 10" fill="none" stroke="#52745c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1080" height="700" rx="24" fill="#f4f6f1"/>
  <g transform="translate(40 0)">
  <text x="500" y="58" text-anchor="middle" class="heading">從日曆到共用看板</text>
  <text x="500" y="100" text-anchor="middle" class="label">通過白名單的成員，連接自己的日曆</text>

  <g transform="translate(0 -10)">
  <circle cx="76" cy="190" r="27" fill="#406d59"/>
  <text x="76" y="201" text-anchor="middle" class="number">1</text>
  <rect x="122" y="136" width="788" height="110" rx="19" fill="#fffdf6" stroke="#d3dfca" stroke-width="2"/>
  <g aria-hidden="true">
    <rect x="160" y="158" width="76" height="66" rx="8" fill="#e4efda" stroke="#85a279" stroke-width="2"/>
    <path d="M160 178H236M178 152V166M218 152V166" stroke="#52745c" stroke-width="4" stroke-linecap="round"/>
    <rect x="174" y="190" width="14" height="12" rx="2" fill="#52745c"/>
    <rect x="207" y="190" width="14" height="12" rx="2" fill="#b6cba9"/>
  </g>
  <text x="274" y="181" class="step-title">成員 Google 日曆</text>
  <text x="274" y="222" class="label">各自建立會議，填寫會議室地點</text>
  </g>
  <path d="M516 238V248" stroke="#52745c" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <g transform="translate(0 -18)">
  <circle cx="76" cy="322" r="27" fill="#406d59"/>
  <text x="76" y="333" text-anchor="middle" class="number">2</text>
  <rect x="122" y="268" width="788" height="110" rx="19" fill="#edf3e5" stroke="#c8d9ba" stroke-width="2"/>
  <g aria-hidden="true">
    <path d="M175 316V303A23 23 0 0 1 221 303V316" fill="none" stroke="#52745c" stroke-width="6" stroke-linecap="round"/>
    <rect x="165" y="312" width="66" height="43" rx="9" fill="#fffdf6" stroke="#85a279" stroke-width="2"/>
    <path d="M185 334L194 343L212 326" fill="none" stroke="#406d59" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="274" y="313" class="step-title">本人同意兩項唯讀授權</text>
  <text x="274" y="354" class="label">日曆活動唯讀 ＋ 日曆清單唯讀</text>
  </g>
  <path d="M516 362V372" stroke="#52745c" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <g transform="translate(0 -26)">
  <circle cx="76" cy="454" r="27" fill="#406d59"/>
  <text x="76" y="465" text-anchor="middle" class="number">3</text>
  <rect x="122" y="400" width="788" height="110" rx="19" fill="#fffdf6" stroke="#d3dfca" stroke-width="2"/>
  <g aria-hidden="true">
    <path d="M165 425H231L211 451V474L185 484V451Z" fill="#e4efda" stroke="#52745c" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="178" cy="437" r="4" fill="#52745c"/>
    <circle cx="198" cy="437" r="4" fill="#52745c"/>
    <circle cx="218" cy="437" r="4" fill="#52745c"/>
  </g>
  <text x="274" y="445" class="step-title">Roomly 依會議室地點彙整</text>
  <text x="274" y="486" class="label">只顯示符合設定地點的預約</text>
  </g>
  <path d="M516 486V496" stroke="#52745c" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <g transform="translate(0 -34)">
  <circle cx="76" cy="586" r="27" fill="#406d59"/>
  <text x="76" y="597" text-anchor="middle" class="number">4</text>
  <rect x="122" y="532" width="788" height="110" rx="19" fill="#e4efda" stroke="#bfd2ad" stroke-width="2"/>
  <g aria-hidden="true">
    <rect x="157" y="559" width="70" height="50" rx="8" fill="#253c3c"/>
    <rect x="164" y="566" width="56" height="36" rx="3" fill="#fffdf6"/>
    <rect x="228" y="574" width="29" height="49" rx="6" fill="#253c3c"/>
    <rect x="233" y="581" width="19" height="32" rx="2" fill="#fffdf6"/>
    <rect x="170" y="577" width="36" height="6" rx="2" fill="#a8c293"/>
    <rect x="170" y="588" width="24" height="6" rx="2" fill="#d8e3ce"/>
    <rect x="236" y="589" width="13" height="5" rx="1" fill="#a8c293"/>
    <rect x="236" y="599" width="13" height="5" rx="1" fill="#d8e3ce"/>
  </g>
  <text x="274" y="577" class="step-title">平板／手機共用看板</text>
  <text x="274" y="618" class="label">查看預約、空檔與受邀參與者</text>
  </g>

  <text x="500" y="653" text-anchor="middle" font-size="30" font-weight="700">新增／修改預約 → 回到 Google 日曆</text>
  <text x="500" y="689" text-anchor="middle" class="note">虛構示意 · 看板顯示日曆資料，並非實際占用偵測</text>
  </g>
</svg>
