<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roomly · 白名單管理</title><link rel="stylesheet" href="access.css"><script src="access.js" defer></script><script src="admin.js" defer></script><link rel="manifest" href="/roomly/manifest.webmanifest"><meta name="theme-color" content="#1b3335"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Roomly"><link rel="apple-touch-icon" href="/roomly/apple-touch-icon.png"><link rel="stylesheet" href="pwa.css"><script src="pwa.js" defer></script></head><body data-page="admin"><main class="admin-page"><header class="admin-header"><a class="access-brand" href="/roomly/"><span>r.</span>roomly</a><nav class="admin-nav"><a href="/roomly/">回看板</a><button id="sign-out" class="secondary">登出</button></nav></header><h1>白名單管理</h1><p class="admin-note">你可以直接新增 Email，或審核登入申請。白名單控制網站使用資格；對方登入並通過核准後，會接著要求 Google 日曆唯讀授權。</p><p id="access-status" role="status">正在載入…</p><section class="allowlist-panel"><h2>自行新增白名單</h2><form id="allowlist-form"><label for="allowlist-email">Google Email</label><div class="allowlist-controls"><input id="allowlist-email" type="email" required maxlength="254" placeholder="name@gmail.com" autocomplete="off"><button id="allowlist-add" type="submit" disabled>加入白名單</button></div></form><p class="admin-note">可先加入 Email，對方再登入。Gmail／Google Workspace 帳號符合時直接核准；其他 Email 的 Google 帳號仍需在下方審核。清單會保存在伺服器，各裝置共用。</p><div id="allowlist-members"></div></section><h2 id="pending-heading">待審核</h2><div id="pending-members"></div><h2>已核准</h2><div id="reviewed-members"></div><div class="notification-tools"><button id="refresh-members" class="secondary">重新整理</button><button id="retry-mail" class="secondary">重試尚未寄出的通知</button></div></main></body></html>
